spring:
  application:
    name: briefly
  config:
    import: optional:file:./.env[.properties]

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}

    ollama:
      chat:
        num-ctx: 16384

app:
  ai:
    agents:
      brief-generation:
        model: ollama/qwen3.5:4b

springdoc:
  # Publish only the two public News Brief endpoints.
  paths-to-match: /api/briefs/generate, /api/briefs/generate/html
  swagger-ui:
    path: /swagger-ui.html

gnews:
  client:
    base-url: https://gnews.io/api/v4
    api-key: ${GNEWS_API_KEY:}

logging:
  pattern:
    # Prefix every log line of a News Brief request with its correlation ID.
    correlation: "[%X{correlation_id:-}] "

  level:
    root: WARN
    io.github.lefpap.briefly: DEBUG
