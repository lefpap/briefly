spring:
  application:
    name: briefly
  config:
    import: optional:file:./.env[.properties]

  ai:
    openai:
      # Empty defaults let AiProviderProperties report a missing variable at startup.
      base-url: ${BRIEFLY_AI_BASE_URL:}
      api-key: ${BRIEFLY_AI_API_KEY:}
      # A failed AI call is reported once instead of being retried.
      max-retries: 0
      chat:
        model: ${BRIEFLY_AI_MODEL:}

springdoc:
  # Publish only the two public News Brief endpoints.
  paths-to-match: /api/briefs/generate, /api/briefs/generate/html
  swagger-ui:
    path: /swagger-ui.html

gnews:
  client:
    base-url: https://gnews.io/api/v4
    api-key: ${GNEWS_API_KEY:}

logging:
  pattern:
    # Prefix every log line of a News Brief request with its correlation ID.
    correlation: "[%X{correlation_id:-}] "

  level:
    root: WARN
    io.github.lefpap.briefly: INFO
