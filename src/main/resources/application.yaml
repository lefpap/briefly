spring:
  application:
    name: briefly
  config:
    import: optional:file:./.env[.properties]

  ai:
    openai:
      base-url: ${BRIEFLY_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${BRIEFLY_AI_API_KEY}
      chat:
        model: ${BRIEFLY_AI_MODEL:gemini-3.7-flash}

springdoc:
  # Publish only the two public News Brief endpoints.
  paths-to-match: /api/briefs/generate, /api/briefs/generate/html
  swagger-ui:
    path: /swagger-ui.html

gnews:
  client:
    base-url: https://gnews.io/api/v4
    api-key: ${GNEWS_API_KEY}


logging:
  level:
    io.github.lefpap.briefly.lib.gnews.GNewsClient: DEBUG
