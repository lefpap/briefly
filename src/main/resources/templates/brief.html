<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${brief.title} + ' — Briefly'">News Brief — Briefly</title>
    <style>
        :root { color-scheme: light; --paper: #faf9f6; --ink: #242a2b; --muted: #62696a; --rule: #e2e5e2; --accent: #355e55; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.75 'Segoe UI', 'Avenir Next', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: var(--accent); text-underline-offset: .2em; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 3px; }
        .sheet { max-width: 1120px; margin: auto; padding: 0 40px; }
        .masthead { padding: 24px 0; border-bottom: 1px solid var(--rule); }
        .brand { font-size: 27px; font-weight: 750; letter-spacing: -.06em; }
        .hero { max-width: 780px; margin: auto; padding: 56px 0 36px; }
        .eyebrow { color: var(--accent); font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
        h1, h2, h3 { line-height: 1.25; text-align: left; overflow-wrap: break-word; }
        h1 { font-size: clamp(32px, 4.5vw, 48px); font-weight: 650; letter-spacing: -.035em; margin: 14px 0 20px; }
        h2 { font-size: 24px; font-weight: 650; letter-spacing: -.025em; margin: 0 0 20px; }
        p { margin: 0 0 18px; }
        .meta { font-size: 13px; line-height: 1.6; color: var(--muted); }
        .criteria { display: flex; flex-wrap: wrap; gap: 16px 32px; margin: 26px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); }
        .criteria > div:first-child { flex-basis: 100%; }
        dt { color: var(--muted); font-size: 11px; font-weight: 600; }
        dd { font-size: 13px; margin: 3px 0 0; overflow-wrap: break-word; }
        .reading { max-width: 780px; margin: auto; padding: 8px 0 56px; }
        .prose { white-space: pre-line; overflow-wrap: break-word; word-break: normal; text-align: left; }
        .overview { font-size: 18px; line-height: 1.85; }
        .highlights { margin-top: 36px; }
        .highlight { padding: 0 0 24px; margin-bottom: 24px; border-bottom: 1px solid var(--rule); }
        .highlight:last-child { margin-bottom: 0; border: 0; padding-bottom: 0; }
        .citations { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
        .citations a { display: inline-grid; place-items: center; min-width: 28px; min-height: 28px; background: #eaf0ec; border-radius: 6px; text-decoration: none; font-weight: 600; }
        .sources { padding: 32px 0 56px; border-top: 1px solid var(--rule); }
        .section-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; margin-bottom: 24px; }
        .section-heading h2, .section-heading p { margin: 0; }
        .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
        .source-card { min-width: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; scroll-margin-top: 24px; }
        .source-card:target { outline: 3px solid var(--accent); outline-offset: 4px; }
        .image-region { position: relative; aspect-ratio: 2 / 1; overflow: hidden; background: #eaf0ec; }
        .fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #668377; background: linear-gradient(145deg, #eaf0ec, #dce7df); }
        .fallback span { font-size: 48px; font-weight: 650; letter-spacing: -.07em; }
        .image-region img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; color: transparent; }
        .card-body { padding: 24px; display: flex; flex: 1; flex-direction: column; }
        .card-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
        .citation-number { flex-shrink: 0; color: var(--accent); font-weight: 650; }
        .publisher { min-width: 0; overflow-wrap: break-word; }
        .publisher a { color: inherit; text-decoration: none; }
        .card-body h3 { font-size: 21px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 12px; line-height: 1.4; }
        .card-body h3 a { color: var(--ink); text-decoration: none; }
        .card-body h3 a:hover { color: var(--accent); text-decoration: underline; }
        .card-description { font-size: 15px; line-height: 1.7; color: var(--muted); white-space: normal; overflow-wrap: break-word; margin-bottom: 20px; }
        .card-date { margin-top: auto; font-size: 12px; color: var(--muted); padding-top: 12px; }
        .footer { max-width: 780px; margin: auto; padding: 24px 0; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
        @media (max-width: 700px) {
            .sheet { padding: 0 20px; }
            .hero { padding-top: 32px; }
            .source-grid { grid-template-columns: 1fr; gap: 20px; }
            .card-body { padding: 20px; }
            .criteria { gap: 14px 24px; }
            .reading { padding-bottom: 36px; }
        }
    </style>
</head>
<body>
<div class="sheet">
    <header class="masthead">
        <span class="brand">Briefly.</span>

    </header>
    <main>
        <header class="hero">
            <div class="eyebrow">News Brief</div>
            <h1 th:text="${brief.title}">News Brief title</h1>
            <p class="meta" th:if="${brief.generatedAt != null}">Generated
                <time th:datetime="${brief.generatedAt}" th:text="${@briefTemplateSupport.timestamp(brief.generatedAt)}"></time>
            </p>
            <dl class="criteria" aria-label="Brief Criteria">
                <div><dt>Query</dt><dd th:text="${brief.criteria.query}"></dd></div>
                <div th:if="${brief.criteria.from != null}"><dt>Reporting Window · From</dt>
                    <dd><time th:datetime="${brief.criteria.from}" th:text="${@briefTemplateSupport.timestamp(brief.criteria.from)}"></time></dd></div>
                <div th:if="${brief.criteria.to != null}"><dt>Reporting Window · To</dt>
                    <dd><time th:datetime="${brief.criteria.to}" th:text="${@briefTemplateSupport.timestamp(brief.criteria.to)}"></time></dd></div>
            </dl>
        </header>
        <div class="reading">
            <section aria-labelledby="overview-heading">
                <h2 id="overview-heading">Overview</h2>
                <p class="prose overview" th:text="${brief.overview}"></p>
            </section>
            <section class="highlights" aria-labelledby="highlights-heading">
                <h2 id="highlights-heading">Highlights</h2>
                <div class="highlight" th:each="highlight : ${brief.highlights}">
                    <p class="prose" th:text="${highlight.text}"></p>
                    <div class="citations"><span>Source Articles</span>
                        <a th:each="citationId : ${highlight.citationIds}" th:href="${'#source-' + citationId}"
                           th:text="${'[' + citationId + ']'}" th:aria-label="${'Source Article ' + citationId}"></a>
                    </div>
                </div>
            </section>
        </div>
        <section class="sources" aria-labelledby="sources-heading">
            <div class="section-heading">
                <h2 id="sources-heading">Source Articles</h2>
                <p class="meta" th:text="${#lists.size(brief.sourceArticles) + ' articles behind this News Brief'}"></p>
            </div>
            <div class="source-grid">
                <article class="source-card" th:each="source : ${brief.sourceArticles}"
                         th:id="${'source-' + source.citationId}"
                         th:with="articleHref=${@briefTemplateSupport.httpUri(source.article.url)}, publisherHref=${@briefTemplateSupport.httpUri(source.article.publisher.url)}, imageSrc=${@briefTemplateSupport.httpUri(source.article.metadata.imageUrl)}">
                    <div class="image-region" aria-hidden="true">
                        <div class="fallback"><span>B.</span></div>
                        <img th:if="${imageSrc != null}" th:src="${imageSrc}" alt="" loading="lazy" referrerpolicy="no-referrer">
                    </div>
                    <div class="card-body">
                        <div class="card-meta">
                            <span class="citation-number" th:text="${'[' + source.citationId + ']'}"></span>
                            <span class="publisher" th:if="${!#strings.isEmpty(source.article.publisher.name)}">
                                <a th:if="${publisherHref != null}" th:href="${publisherHref}" th:text="${source.article.publisher.name}" target="_blank" rel="noopener noreferrer"></a>
                                <span th:unless="${publisherHref != null}" th:text="${source.article.publisher.name}"></span>
                            </span>
                        </div>
                        <h3>
                            <a th:if="${articleHref != null}" th:href="${articleHref}" th:text="${source.article.title}" target="_blank" rel="noopener noreferrer"></a>
                            <span th:unless="${articleHref != null}" th:text="${source.article.title}"></span>
                        </h3>
                        <p class="card-description" th:if="${!#strings.isEmpty(source.article.description)}" th:text="${source.article.description}"></p>
                        <time class="card-date" th:if="${source.article.metadata.publishedAt != null}" th:datetime="${source.article.metadata.publishedAt}" th:text="${@briefTemplateSupport.timestamp(source.article.metadata.publishedAt)}"></time>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <footer class="footer">Briefly · Citations identify the Source Articles used for each Highlight; they do not establish independent fact verification.</footer>
</div>
</body>
</html>
